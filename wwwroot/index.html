<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>File Browser</title>
    <link rel="stylesheet" runat="server" media="screen" href="css/styles.css" />
</head>
<body>
    <main>
        <h1>File Browser</h1>
        <form id="searchForm">
            <input type="search" id="query" placeholder="Search names in current folder and below…" aria-label="Search" />
            <button type="submit">Search</button>
            <button type="button" id="clear">Clear</button>

        </form>
        <div class="crumbBar">
            <div class="crumbLeft">
                <div id="crumbs"></div>
                <span id="itemCount" role="status" aria-live="polite"></span>
            </div>
        </div>
        <div id="status" role="status"></div>
        <div class="layout">
            <section class="content">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Location</th>
                            <th class="num">Size</th>
                            <th class="num">Modified</th>
                        </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </section>
            <div class="sidebar">
                <aside class="settings">
                    <h1>Settings</h1>
                    <div class="homeInfo">
                        <label>Home Directory:</label>
                        <span id="currentHome"></span>
                    </div>
                    <form id="settingsForm">
                        <input type="text" id="rootPath" placeholder="Set new home..." aria-label="Home Path" />
                        <button type="submit">Set Path</button>
                    </form>

                </aside>

                <aside class="settings">
                    <h1>File Actions</h1>
                    <button type="button" id="uploadBtn"><span class="plus" aria-hidden="true">+</span> Upload</button>
                    <div id="uploadstatus" role="status"></div>
                    <div class="actionRow">
                        <button type="button" id="downloadBtn" disabled>Download</button>
                        <button type="button" id="deleteBtn" disabled>Delete</button>
                        <button type="button" id="clearSelection" disabled>Clear selection</button>
                    </div>
                    <div id="downloadOrDeleteStatus" role="status"></div>
                </aside>
            </div>
        </div>

        <dialog id="uploadDialog" aria-labelledby="uploadTitle">
            <form id="uploadForm">
                <h2 id="uploadTitle">Upload Files</h2>
                <input type="file" id="uploadFiles" name="files" multiple aria-label="Files to upload" />
                <ul id="uploadList"></ul>
                <div id="uploadMessage" role="alert"></div>

                <div class="dialogButtons">
                    <button type="button" id="uploadCancel">Cancel</button>
                    <button type="submit" id="uploadSubmit" disabled>Upload</button>
                </div>
            </form>
        </dialog>

    </main>
    <!-- Order matters: app.js defines the shared helpers the other two scripts use at load time -->
    <script src="js/app.js"></script>
    <script src="js/search.js"></script>
    <script src="js/upload.js"></script>
    <script src="js/download.js"></script>
    <script src="js/delete.js"></script>
</body>
</html>
